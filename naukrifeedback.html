<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Connect.in</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #F2C2A9;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: #BFD3C1;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0.1, 0, 0, 0.1);
            margin: auto;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .rating {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }
        .rating input {
            display: none;
        }
        .rating label {
            font-size: 30px;
            cursor: pointer;
            color: white;
        }
        .rating input:checked ~ label {
            color: gold;
        }
        button {
            width: 100%;
            background: #007BFF;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
    <script>
        function submitFeedback() {
            alert("Thank you for your feedback! We appreciate your input.");
            document.getElementById("feedback-form").reset();
        }
    </script>
</head>
<body>

    <div class="container">
        <h2>Feedback Form</h2>
        <p style="text-align: center;">We value your feedback. Please let us know how we can improve!</p>
        
        <form id="feedback-form" onsubmit="submitFeedback(); return false;">
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Your Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Rate Your Experience:</label>
            <div class="rating">
                <input type="radio" id="star1" name="rating" value="1"><label for="star1">★</label>
                <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
                <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
                <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
                <input type="radio" id="star5" name="rating" value="5"><label for="star5">★</label>
            </div>

            <label for="comments">Your Feedback:</label>
            <textarea id="comments" name="comments" rows="4" required></textarea>

            <button type="submit">Submit Feedback</button>
        </form>
    </div>

</body>
</html>
