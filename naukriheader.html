<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect.in</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, black, pink);
            color: white;
            text-align: center;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            position: relative;
        }

        /* Move logo slightly upwards */
        .logo {
            margin-top: -15px; /* Adjust this value */
        }

        .logo img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            filter: brightness(1.2);
        }

        .profile-container {
            position: relative;
            margin-left: auto;
        }

        /* Move profile photo slightly upwards */
        .profile-photo {
            cursor: pointer;
            margin-top: -15px; /* Adjust this value */
        }

        .profile-photo img {
            height: 60px;
            width: 60px;
            border-radius: 50%;
            object-fit: cover;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 1.8rem;
            flex: 1;
        }

        /* Profile Dropdown Styles */
        .profile-dropdown {
            position: absolute;
            top: 70px;
            right: 0;
            background-color: #BFD3C1;
            min-width: 160px;
            border-radius: 5px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            z-index: 1;
            display: none;
            border: 2px solid #8BA891;
        }

        .profile-dropdown a {
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            display: block;
            text-align: left;
        }

        .profile-dropdown a:hover {
            background-color: #575757;
        }

        .profile-dropdown.active {
            display: block;
        }
    </style>
    <script>
        function toggleProfileDropdown(event) {
            const dropdown = document.getElementById('profile-dropdown');
            dropdown.classList.toggle('active');
            event.stopPropagation();
        }

        function closeProfileDropdown(event) {
            const dropdown = document.getElementById('profile-dropdown');
            const profilePhoto = document.getElementById('profile-photo');

            if (!dropdown.contains(event.target) && !profilePhoto.contains(event.target)) {
                dropdown.classList.remove('active');
            }
        }

        function viewProfile() {
            const user = JSON.parse(localStorage.getItem('user'));

            if (user) {
                alert(`Name: ${user.name}\nEmail: ${user.email}`);
            } else {
                alert('No user data found. Please log in or sign up.');
            }

            document.getElementById('profile-dropdown').classList.remove('active');
        }

        function logout() {
            localStorage.removeItem('user'); // Clear user data
            alert('You have logged out successfully!');
            document.getElementById('profile-dropdown').classList.remove('active');
        }

        document.addEventListener('click', closeProfileDropdown);
    </script>
</head>
<body>
    <header>
        <!-- Left: Logo -->
        <div class="logo">
            <img src="logoconnect.png" alt="Company Logo">
        </div>

        <!-- Center: Title -->
        <h1>Connect.in</h1>

        <!-- Right: Profile Photo -->
        <div class="profile-container">
            <div class="profile-photo" id="profile-photo" onclick="toggleProfileDropdown(event)">
                <img src="profile-photo.jpeg" alt="Profile Photo">
            </div>

            <div class="profile-dropdown" id="profile-dropdown">
                <a href="#" onclick="viewProfile()">View Profile</a>
                <a href="#" onclick="logout()">Logout</a>
            </div>
        </div>
    </header>
</body>
</html>
